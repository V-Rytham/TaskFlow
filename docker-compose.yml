services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow_local_only
      POSTGRES_DB: taskflow
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - taskflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  taskflow_data:
