services:
  - type: web
    name: taskflow
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:deploy
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
